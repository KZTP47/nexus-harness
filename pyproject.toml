[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "our-harness-cli"
version = "0.2.0"
description = "A local test lab and coding assistant: writes your checks, runs them, and says plainly what broke"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Harness Contributors"}]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["langgraph>=1.2.11,<2"]

[project.scripts]
harness = "our_harness.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
our_harness = ["ui/*.html", "ui/*.css", "ui/*.js", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
