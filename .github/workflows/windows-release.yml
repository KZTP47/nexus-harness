name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-deadline:
    name: Workflow deadline
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce the complete workflow budget
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--required-job "Build installer" --required-job "Installed app"
                --required-job "Installed long-horizon" --required-job "Installed team-chat"
                --required-job "Installed shortcuts" --required-job "Publish release"
                --required-job "Public downloads" --required-job "Public source ZIP")
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            args+=(--allow-skipped-job "Publish release" --allow-skipped-job "Public downloads" --allow-skipped-job "Public source ZIP")
          fi
          python scripts/ci_budget.py watch "${args[@]}"

  clean-windows-build:
    name: Build installer
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require successful Checks for this exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runs = @(gh run list --workflow checks.yml --commit "$env:GITHUB_SHA" --limit 1 --json headSha,status,conclusion | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $runs.Count -ne 1 -or
              $runs[0].headSha -cne $env:GITHUB_SHA -or
              $runs[0].status -cne 'completed' -or $runs[0].conclusion -cne 'success') {
            throw 'The latest Checks run for this exact commit must pass before packaging a release.'
          }

      - name: Require the release tag to match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match desktop version $version." }

      - name: Prepare Authenticode signing or an explicitly unsigned release
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $expectedPublisher = (Get-Content -Raw -LiteralPath release/windows-authenticode-publisher.txt).Trim()
          $expectedSignerCertificateSha256 = (Get-Content -Raw -LiteralPath release/windows-authenticode-certificate-sha256.txt).Trim().ToLowerInvariant()
          $publisherConfigured = $expectedPublisher -and -not $expectedPublisher.StartsWith('UNCONFIGURED')
          $certificatePinConfigured = $expectedSignerCertificateSha256 -cmatch '\A[0-9a-f]{64}\z'
          $publisherUnconfigured = $expectedPublisher -and $expectedPublisher.StartsWith('UNCONFIGURED')
          $certificatePinUnconfigured = $expectedSignerCertificateSha256 -and $expectedSignerCertificateSha256.StartsWith('unconfigured')
          if ([bool]$publisherConfigured -xor [bool]$certificatePinConfigured) {
            throw 'Authenticode identity pin configuration is partial: configure publisher Subject and signer certificate SHA-256 together.'
          }
          if (-not $publisherConfigured -and (-not $publisherUnconfigured -or -not $certificatePinUnconfigured)) {
            throw 'Authenticode identity pin configuration is malformed: both pin files must be configured together or explicitly UNCONFIGURED.'
          }
          if ([bool]$env:WINDOWS_CERTIFICATE_BASE64 -xor [bool]$env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Authenticode configuration is partial: set both certificate secrets or neither.'
          }
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            if (-not $publisherConfigured) {
              throw 'Set release/windows-authenticode-publisher.txt to the certificate exact Subject before signing.'
            }
            $certificate = Join-Path $env:RUNNER_TEMP 'nexus-authenticode.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $pfx = Get-PfxData -FilePath $certificate -Password $password
            $endEntityCertificates = @($pfx.EndEntityCertificates)
            if ($endEntityCertificates.Count -ne 1) {
              throw "Expected one end-entity Authenticode certificate, found $($endEntityCertificates.Count)."
            }
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $actualSignerCertificateSha256 = -join ($sha.ComputeHash($endEntityCertificates[0].RawData) | ForEach-Object { $_.ToString('x2') })
            } finally {
              $sha.Dispose()
            }
            if ($endEntityCertificates[0].Subject -cne $expectedPublisher -or
                $actualSignerCertificateSha256 -cne $expectedSignerCertificateSha256) {
              throw 'The supplied signing certificate does not match both versioned Authenticode identity pins.'
            }
            "CSC_LINK=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "NEXUS_SIGNED_BUILD=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($publisherConfigured) {
            throw 'A Windows publisher is pinned, so release builds require both Authenticode certificate secrets.'
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            "NEXUS_UNSIGNED_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "NEXUS_UNSIGNED_DEV=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "NEXUS_UNSIGNED_DEV=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build versioned NSIS installer
        working-directory: desktop
        run: npm run build -- --win nsis

      - name: Give a signed release its canonical public filename
        if: env.NEXUS_SIGNED_BUILD == '1'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/build-output -Filter 'Nexus-Harness-Setup-*-UNSIGNED-DEV.exe')
          if ($installers.Count -ne 1) { throw "Expected one signed release candidate, found $($installers.Count)." }
          Rename-Item -LiteralPath $installers[0].FullName -NewName ($installers[0].Name -replace '-UNSIGNED-DEV\.exe$', '.exe')

      - name: Give a checksum-only release an honest public filename
        if: env.NEXUS_UNSIGNED_RELEASE == '1'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/build-output -Filter 'Nexus-Harness-Setup-*-UNSIGNED-DEV.exe')
          if ($installers.Count -ne 1) { throw "Expected one unsigned release candidate, found $($installers.Count)." }
          Rename-Item -LiteralPath $installers[0].FullName -NewName ($installers[0].Name -replace '-UNSIGNED-DEV\.exe$', '-UNSIGNED.exe')

      - name: Verify the installer Authenticode signature
        if: env.NEXUS_SIGNED_BUILD == '1'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/build-output -Filter 'Nexus-Harness-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate.Subject) {
            throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
          $expectedPublisher = (Get-Content -Raw -LiteralPath release/windows-authenticode-publisher.txt).Trim()
          $expectedSignerCertificateSha256 = (Get-Content -Raw -LiteralPath release/windows-authenticode-certificate-sha256.txt).Trim().ToLowerInvariant()
          if ($signature.SignerCertificate.Subject -cne $expectedPublisher) {
            throw "Installer publisher '$($signature.SignerCertificate.Subject)' does not match pinned publisher '$expectedPublisher'."
          }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actualSignerCertificateSha256 = -join ($sha.ComputeHash($signature.SignerCertificate.RawData) | ForEach-Object { $_.ToString('x2') })
          } finally {
            $sha.Dispose()
          }
          if ($actualSignerCertificateSha256 -cne $expectedSignerCertificateSha256) {
            throw "Installer signer certificate SHA-256 '$actualSignerCertificateSha256' does not match the versioned pin."
          }

      - name: Verify an unsigned release is actually unsigned
        if: env.NEXUS_UNSIGNED_RELEASE == '1'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/build-output -Filter 'Nexus-Harness-Setup-*-UNSIGNED.exe')
          if ($installers.Count -ne 1) { throw "Expected one explicitly unsigned installer, found $($installers.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned' -or $signature.SignerCertificate.Subject) {
            throw "Explicitly unsigned installer has an unexpected signature state: $($signature.Status)."
          }

      - name: Write installer SHA-256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/build-output -Filter 'Nexus-Harness-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Expected one versioned NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          $stream = [IO.File]::OpenRead($installer.FullName)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $hash = -join ($sha.ComputeHash($stream) | ForEach-Object { $_.ToString('x2') })
          } finally {
            $sha.Dispose()
            $stream.Dispose()
          }
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii -NoNewline -LiteralPath "$($installer.FullName).sha256"
          $unpackedBytes = (Get-ChildItem -LiteralPath desktop/build-output/win-unpacked -File -Recurse | Measure-Object -Property Length -Sum).Sum
          if (-not $unpackedBytes) { throw "The unpacked application size could not be measured." }
          [ordered]@{
            schema_version = 1
            installer_bytes = $installer.Length
            installer_mib = [math]::Round($installer.Length / 1MB, 1)
            unpacked_bytes = $unpackedBytes
            unpacked_mib = [math]::Round($unpackedBytes / 1MB, 1)
          } | ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath desktop/build-output/release-metadata.json

      - name: Assemble the product-bound offline installer ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/build-output -Filter 'Nexus-Harness-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Expected one stable installer, found $($installers.Count)." }
          & .\scripts\build_windows_offline_bundle.ps1 `
            -InstallerPath $installers[0].FullName `
            -OutputDirectory (Resolve-Path 'desktop/build-output')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-harness-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            desktop/build-output/Nexus-Harness-Setup-*.exe
            desktop/build-output/Nexus-Harness-Setup-*.exe.sha256
            desktop/build-output/release-metadata.json
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nexus-harness-offline-${{ github.ref_name }}
          if-no-files-found: error
          path: desktop/build-output/Nexus-Harness-Windows-Offline-*.zip
          compression-level: 0

  installed-acceptance:
    name: Installed ${{ matrix.mode }}
    needs: clean-windows-build
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        mode: [app, long-horizon, team-chat, shortcuts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexus-harness-windows-${{ github.ref_name }}
          path: release-candidate
      - name: Install smoke driver dependencies
        if: matrix.mode != 'shortcuts'
        working-directory: desktop
        run: npm ci
      - name: Verify the installed artifact
        shell: pwsh
        run: ./scripts/release_installed_acceptance.ps1 -Mode '${{ matrix.mode }}' -ArtifactDirectory release-candidate
      - name: Locate failed release smoke evidence
        if: failure()
        shell: pwsh
        run: |
          $releaseSmokeTemp = node -p "require('node:os').tmpdir()"
          if ($LASTEXITCODE -ne 0 -or -not [IO.Path]::IsPathRooted($releaseSmokeTemp)) {
            throw 'Could not locate the release smoke temporary directory.'
          }
          "NEXUS_RELEASE_SMOKE_TMPDIR=$releaseSmokeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Keep failed release conversation evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-conversation-failure-${{ matrix.mode }}-${{ github.ref_name }}
          if-no-files-found: ignore
          path: |
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-multivendor-e2e-*/failure.png
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-multivendor-e2e-*/failure.html
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-long-horizon-ui-*/failure.png
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-long-horizon-ui-*/failure.html
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-long-horizon-ui-*/failure.json
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-team-chat-*/scripted provider control/*.png
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-team-chat-*/scripted provider control/*-layout.json
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus-team-chat-*/scripted provider control/failure-goals.json
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus browser source acceptance - */failure-*.png
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus browser source acceptance - */failure-*.json
            ${{ env.NEXUS_RELEASE_SMOKE_TMPDIR }}/nexus browser source acceptance - */source-server.log
          retention-days: 7

  publish-release:
    name: Publish release
    timeout-minutes: 2
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clean-windows-build, installed-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nexus-harness-*-${{ github.ref_name }}
          merge-multiple: true
          path: release
      - name: Refuse an existing mutable release and publish once
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "$default_branch" != "master" ]]; then
            echo "The public source-ZIP contract expects master, not $default_branch." >&2
            exit 1
          fi
          master_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')"
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag $tag points at $GITHUB_SHA while master points at $master_sha." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to replace or append assets." >&2
            exit 1
          fi
          mapfile -t assets < <(find release -maxdepth 1 -type f -name 'Nexus-Harness-Setup-*' -print)
          if [[ ${#assets[@]} -ne 2 ]]; then
            echo "Expected exactly the installer and checksum, found ${#assets[@]}." >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "The release tag is not an exact Nexus Harness version: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          mapfile -t release_installers < <(printf '%s\n' "${assets[@]}" | grep -E '\.exe$')
          if [[ ${#release_installers[@]} -ne 1 ]]; then
            echo "Expected exactly one release installer before publication." >&2
            exit 1
          fi
          release_installer="${release_installers[0]}"
          release_installer_name="$(basename "$release_installer")"
          if [[ "$release_installer_name" != "Nexus-Harness-Setup-${version}.exe" \
              && "$release_installer_name" != "Nexus-Harness-Setup-${version}-UNSIGNED.exe" ]]; then
            echo "Release tag $tag does not match installer $release_installer_name." >&2
            exit 1
          fi
          if [[ ! -f "${release_installer}.sha256" ]]; then
            echo "The exact checksum for $release_installer_name is missing before publication." >&2
            exit 1
          fi
          mapfile -t offline_bundles < <(find release -maxdepth 1 -type f -name 'Nexus-Harness-Windows-Offline-*.zip' -print)
          if [[ ${#offline_bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one product-built offline ZIP, found ${#offline_bundles[@]}." >&2
            exit 1
          fi
          offline_bundle="${offline_bundles[0]}"
          offline_bundle_name="$(basename "$offline_bundle")"
          if [[ "$offline_bundle_name" != "Nexus-Harness-Windows-Offline-${version}.zip" ]]; then
            echo "Release tag $tag does not match offline bundle $offline_bundle_name." >&2
            exit 1
          fi
          metadata="release/release-metadata.json"
          if [[ ! -f "$metadata" ]]; then
            echo "Release size metadata is missing." >&2
            exit 1
          fi
          installer_mib="$(jq -er '.installer_mib | numbers' "$metadata")"
          unpacked_mib="$(jq -er '.unpacked_mib | numbers' "$metadata")"
          notes="Windows installer: exact bytes are protected by the accompanying SHA-256. This release is not Authenticode-signed, so Windows may show an unknown-publisher warning."
          if [[ ! "${assets[*]}" =~ -UNSIGNED\.exe ]]; then
            notes="Windows installer: SHA-256 plus the pinned Authenticode Subject and signer-certificate SHA-256 are verified by the release workflow."
          fi
          notes="$notes The product-bound offline ZIP carries a CMD-pinned bootstrap, installer, checksum, and v2 identity manifest together for computers without GitHub access. The unsigned outer ZIP/CMD still requires trusted transport. Measured download size: ${installer_mib} MiB; unpacked application: ${unpacked_mib} MiB. Allow at least 2 GiB free while installing."
          python scripts/ci_budget.py check --reserve-seconds 300
          gh release create "$tag" "${assets[@]}" "$offline_bundle" --verify-tag --generate-notes --notes "$notes" --title "Nexus Harness $tag"

  public-downloads:
    name: Public downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nexus-harness-*-${{ github.ref_name }}
          merge-multiple: true
          path: release
      - name: Prove the stable release is anonymously installable
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          latest="${RUNNER_TEMP}/nexus-latest-release.json"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --user-agent 'nexus-harness-release-readback' \
                "$api" --output "$latest" \
                && jq -e --arg tag "$tag" '.tag_name == $tag' "$latest" >/dev/null; then
              break
            fi
            if [[ $attempt -eq 12 ]]; then
              echo "The public latest-release API did not expose $tag after publication." >&2
              exit 1
            fi
            sleep 5
          done
          mapfile -t names < <(jq -er '.assets[].name' "$latest")
          if [[ ${#names[@]} -ne 3 ]]; then
            echo "Expected exactly the public installer, checksum, and offline ZIP assets, found: ${names[*]}" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "The stable tag is not an exact Nexus Harness version: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          mapfile -t installers < <(printf '%s\n' "${names[@]}" | grep -E '^Nexus-Harness-Setup-.*\.exe$')
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected one public installer asset, found: ${names[*]}" >&2
            exit 1
          fi
          installer="${installers[0]}"
          if [[ "$installer" != "Nexus-Harness-Setup-${version}.exe" \
              && "$installer" != "Nexus-Harness-Setup-${version}-UNSIGNED.exe" ]]; then
            echo "Stable tag $tag does not match public installer $installer." >&2
            exit 1
          fi
          checksum="${installer}.sha256"
          if [[ ! " ${names[*]} " =~ " ${checksum} " ]]; then
            echo "The public release does not expose ${checksum}." >&2
            exit 1
          fi
          offline_bundle="Nexus-Harness-Windows-Offline-${version}.zip"
          if [[ ! " ${names[*]} " =~ " ${offline_bundle} " ]]; then
            echo "The public release does not expose ${offline_bundle}." >&2
            exit 1
          fi
          public_assets="${RUNNER_TEMP}/nexus-public-release"
          mkdir -p "$public_assets"
          for name in "$installer" "$checksum" "$offline_bundle"; do
            url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$latest")"
            curl --fail --silent --show-error --location \
              --user-agent 'nexus-harness-release-readback' \
              "$url" --output "${public_assets}/${name}"
            if [[ ! -s "${public_assets}/${name}" ]]; then
              echo "The anonymously downloaded public asset is empty: $name" >&2
              exit 1
            fi
            if ! cmp --silent "release/${name}" "${public_assets}/${name}"; then
              echo "The public release bytes differ from the verified build artifact: $name" >&2
              exit 1
            fi
          done
          mapfile -t checksum_lines < "${public_assets}/${checksum}"
          if [[ ${#checksum_lines[@]} -ne 1 ]]; then
            echo "The public checksum must contain exactly one installer record." >&2
            exit 1
          fi
          checksum_line="${checksum_lines[0]%$'\r'}"
          if [[ ! "$checksum_line" =~ ^([0-9a-fA-F]{64})[[:space:]]+(\*)?(.+)$ ]]; then
            echo "The public checksum has an unsupported format." >&2
            exit 1
          fi
          expected_hash="${BASH_REMATCH[1],,}"
          checksum_name="${BASH_REMATCH[3]}"
          if [[ "$checksum_name" != "$installer" ]]; then
            echo "The public checksum names '$checksum_name' instead of '$installer'." >&2
            exit 1
          fi
          actual_hash="$(sha256sum "${public_assets}/${installer}" | awk '{print $1}')"
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "The anonymously downloaded public installer does not match its checksum." >&2
            exit 1
          fi

  prove-public-source-zip:
    name: Public source ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: windows-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Install from the exact public GitHub source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tag = [string]$env:GITHUB_REF_NAME
          if ($tag -cnotmatch '\Av(?<version>[0-9]+(?:\.[0-9]+){2})\z') {
            throw "The source-ZIP acceptance tag is invalid: $tag"
          }
          $version = $Matches['version']
          $masterMetadata = Join-Path $env:RUNNER_TEMP 'nexus-master.json'
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/master" `
            -Headers @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'nexus-source-zip-acceptance' } `
            -OutFile $masterMetadata
          $masterSha = [string](Get-Content -Raw -LiteralPath $masterMetadata | ConvertFrom-Json).sha
          if ($masterSha -cne [string]$env:GITHUB_SHA) {
            throw "The release commit is '$env:GITHUB_SHA', but public master is '$masterSha'."
          }
          $probeRoot = Join-Path $env:RUNNER_TEMP "Nexus source ZIP - Åsa & O'Brien (QA)!"
          $archive = Join-Path $probeRoot 'nexus-source.zip'
          $extractRoot = Join-Path $probeRoot 'extracted source'
          $unrelated = Join-Path $probeRoot 'unrelated working directory'
          New-Item -ItemType Directory -Force -Path $extractRoot, $unrelated | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$env:GITHUB_REPOSITORY/archive/refs/heads/master.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $sourceRoots = @(Get-ChildItem -LiteralPath $extractRoot -Directory)
          if ($sourceRoots.Count -ne 1) {
            throw "Expected one source root in the public ZIP, found $($sourceRoots.Count)."
          }
          $sourceRoot = $sourceRoots[0].FullName
          $installerCommand = Join-Path $sourceRoot 'Install Nexus Harness.cmd'
          if (-not (Test-Path -LiteralPath $installerCommand -PathType Leaf)) {
            throw 'The public source ZIP does not contain Install Nexus Harness.cmd.'
          }
          if (@(Get-ChildItem -LiteralPath $sourceRoot -Filter 'Nexus-Harness-Setup-*.exe' -File).Count -ne 0) {
            throw 'The source-ZIP check unexpectedly found a sibling installer instead of exercising the public release download.'
          }

          $env:NEXUS_INSTALLER_NO_PAUSE = '1'
          $env:NEXUS_INSTALLER_SILENT = '1'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          # Start-Process uses the registered Windows .cmd association, matching
          # the ShellExecute path used by an Explorer double-click.
          $installerProcess = Start-Process -FilePath $installerCommand `
            -WorkingDirectory $unrelated -Wait -PassThru -WindowStyle Hidden
          $installerExit = $installerProcess.ExitCode
          if ($installerExit -ne 0) {
            throw "The exact public source-ZIP CMD stopped with code $installerExit."
          }

          $applicationGuid = 'e52322ab-f15e-5dc0-963b-7588e3739e89'
          $installKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Software\$applicationGuid")
          try {
            if ($null -eq $installKey) {
              throw 'The source-ZIP CMD returned success without exact current-user install metadata.'
            }
            $installLocation = [string]$installKey.GetValue('InstallLocation')
          } finally {
            if ($null -ne $installKey) { $installKey.Dispose() }
          }
          $installed = Join-Path $installLocation 'Nexus Harness.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw "The source-ZIP CMD returned success without the installed app: $installed"
          }
          $versionInfo = (Get-Item -LiteralPath $installed).VersionInfo
          $fileVersion = [string]$versionInfo.FileVersion
          $productVersion = [string]$versionInfo.ProductVersion
          $versionPattern = '\A' + [Regex]::Escape($version) + '(?:\.0)?\z'
          if ($fileVersion -cnotmatch $versionPattern -or
              $productVersion -cnotmatch $versionPattern) {
            throw "The source ZIP installed file/product versions '$fileVersion'/'$productVersion' instead of '$version'."
          }

          $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          $shortcutPath = Join-Path $desktop 'Nexus Harness.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
            throw "The source-ZIP CMD did not create the desktop shortcut: $shortcutPath"
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $null
          try {
            $shortcut = $shell.CreateShortcut($shortcutPath)
            $target = [IO.Path]::GetFullPath([string]$shortcut.TargetPath)
            $arguments = [string]$shortcut.Arguments
            $workingDirectory = [IO.Path]::GetFullPath([string]$shortcut.WorkingDirectory)
            $iconLocation = [string]$shortcut.IconLocation
          } finally {
            if ($null -ne $shortcut -and [Runtime.InteropServices.Marshal]::IsComObject($shortcut)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($shortcut)
            }
            if ([Runtime.InteropServices.Marshal]::IsComObject($shell)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($shell)
            }
          }
          $installed = [IO.Path]::GetFullPath($installed)
          $installedFolder = [IO.Path]::GetFullPath((Split-Path -Parent $installed))
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($target, $installed) -or
              $arguments -cne '' -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals($workingDirectory, $installedFolder) -or
              $iconLocation -cne "$installed,0") {
            throw "The source-ZIP desktop shortcut is stale or malformed: target='$target'; arguments='$arguments'; working='$workingDirectory'; icon='$iconLocation'."
          }

          $launched = @()
          try {
            [void](Start-Process -FilePath $shortcutPath -PassThru)
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $launched = @(Get-CimInstance Win32_Process | Where-Object {
                $_.ExecutablePath -and [StringComparer]::OrdinalIgnoreCase.Equals(
                  [IO.Path]::GetFullPath($_.ExecutablePath), $installed
                )
              })
              if ($launched.Count -eq 0) { Start-Sleep -Milliseconds 250 }
            } while ($launched.Count -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($launched.Count -eq 0) {
              throw 'The source-ZIP desktop shortcut did not launch the installed app.'
            }
          } finally {
            foreach ($process in $launched) {
              [void](Start-Process -FilePath "$env:SystemRoot\System32\taskkill.exe" `
                -ArgumentList @('/PID', [string]$process.ProcessId, '/T', '/F') `
                -Wait -PassThru -WindowStyle Hidden)
            }
          }
