name: Checks

# Everything that has to pass before a change is trusted. The jobs below do not
# wait for each other, so the wait is as long as the slowest one rather than the
# sum of all of them. The main suite is split into four parts on Python 3.13 and
# eight parts on Python 3.11; the extra compatibility shards keep its slower
# interpreter lane in the same roughly two-to-five-minute window.
#
# Windows only, on purpose: this is the machine the project is developed and
# checked on, so a green build here means the same thing as a green run at a
# desk. Adding Linux is a one line change once somebody has run the tests there
# and seen them pass - a build that goes red on its first run teaches nobody
# anything.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests, part ${{ matrix.part }} of 4
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the test-only runtime dependencies
        # scripts/run_tests.py deliberately proves that a plain source
        # download works before the harness is installed. Install LangGraph,
        # which the persistent-memory and long-horizon tests exercise, without
        # installing this project and invalidating that plain-download test.
        run: python -m pip install "langgraph>=1.2.11,<2" "langgraph-checkpoint-sqlite>=3.1.1,<4"
      - name: Run this part of the tests
        run: python scripts/run_tests.py --part ${{ matrix.part }}/4 --quiet

  tests-on-the-oldest-python:
    name: Tests on Python 3.11, part ${{ matrix.part }} of 8
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the test-only runtime dependencies
        run: python -m pip install "langgraph>=1.2.11,<2" "langgraph-checkpoint-sqlite>=3.1.1,<4"
      - name: Run this part of the tests
        # All eight parts together still cover the whole suite on the oldest
        # Python we promise to support. Matrix jobs run beside one another, so
        # compatibility coverage no longer turns into one 20-minute wait.
        run: python scripts/run_tests.py --part ${{ matrix.part }}/8 --quiet

  panel:
    name: Panel checks, part ${{ matrix.part }} of 4
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install the harness runtime
        # These are real source-checkout UI flows. Installing the project here
        # both supplies its declared LangGraph runtime and proves that commands
        # launched by the panel work without inheriting PYTHONPATH from CI.
        run: python -m pip install -e .
      - name: Fetch the browser driver
        run: |
          npm ci
          npx playwright install chromium
      - name: Say this checkout is ours
        # The settings file in this repository names the commands the harness
        # may run. A machine will not read that from a file somebody handed it
        # until it is told the file is trusted, which is the whole point of the
        # rule. Saying so here is deliberate: this is our own repository.
        env:
          PYTHONPATH: src
        run: python -m our_harness trust --yes
      - name: Start the panel and run this part of the checks
        # One step, on purpose. Each step gets its own shell, and a program
        # started in one is not promised to be alive in the next: the panel was
        # started, said it was ready, and was gone by the time the checks
        # looked, so every one of them failed with "connection refused".
        env:
          PYTHONPATH: src
        run: |
          $panel = Start-Process -FilePath python -PassThru `
            -ArgumentList "-m","our_harness","ui","--port","8765","--no-open-browser" `
            -RedirectStandardOutput panel-out.log -RedirectStandardError panel-err.log
          try {
            $ready = $false
            foreach ($try in 1..60) {
              try {
                Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              Get-Content panel-out.log, panel-err.log -ErrorAction SilentlyContinue
              throw "The control panel did not start, so none of these checks would mean anything."
            }
            # These browser checks change saved boards and pipelines. Running
            # several against one checkout at once makes one check delete or
            # replace state another check is still reading. Exercise the two
            # primary, visible workspaces serially; the complete feature set
            # remains covered by the Python and desktop suites above.
            python -m our_harness qa run `
              --suite .harness/qa/workflows.json `
              --tag swarm --tag pipelines `
              --part ${{ matrix.part }}/4 `
              --workers 1 `
              --format json `
              --output .harness/qa/ci-report.json
          } finally {
            if ($panel -and -not $panel.HasExited) { Stop-Process -Id $panel.Id -Force }
          }
      - name: Make sure they really ran
        # Without a browser driver every one of these checks says "this could
        # not be tried here" and the run passes. A build that checked nothing
        # and went green is worse than no build at all.
        run: |
          $report = Get-Content .harness/qa/ci-report.json -Raw | ConvertFrom-Json
          $counts = $report.counts
          Write-Host "$($counts.passed) passed, $($counts.failed) failed, $($counts.skipped) skipped."
          if ($counts.skipped -gt 0) {
            throw "$($counts.skipped) check(s) could not be tried here, so this build proves less than it looks like it does."
          }
          if ($counts.total -lt 1) {
            throw "Only $($counts.total) checks ran in this part. Something is wrong with how the suite was split."
          }
          if (-not $report.passed) { throw "Some checks failed." }
      - name: Keep what the failures looked like
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panel-part-${{ matrix.part }}
          # Everything worth keeping lives under .harness, and a folder whose
          # name starts with a dot is left out unless this says otherwise. That
          # is how a failed build came back with nothing to read.
          include-hidden-files: true
          path: |
            .harness/qa/runs
            .harness/qa/ci-report.json
            panel-out.log
            panel-err.log
          retention-days: 7

  project-checks:
    name: The project's own suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Fetch the browser driver
        run: |
          npm ci
          npx playwright install chromium
      - name: Install the harness itself
        # This suite runs the harness by name, and the commands in it start
        # their own programs. What a started program is allowed to see is a
        # short list that does not include PYTHONPATH, so it has to be really
        # installed rather than pointed at.
        run: python -m pip install -e .
      - name: Say this checkout is ours
        # The settings file in this repository names the commands the harness
        # may run. A machine will not read that from a file somebody handed it
        # until it is told the file is trusted, which is the whole point of the
        # rule. Saying so here is deliberate: this is our own repository.
        env:
          PYTHONPATH: src
        run: python -m our_harness trust --yes
      - name: Prove the browser driver is really there
        # Twice: once as this shell sees it, and once as the harness itself
        # sees it, because those are two different questions and only the
        # second one decides whether a browser check runs.
        env:
          PYTHONPATH: src
        run: |
          node -e "require.resolve('playwright'); console.log('this shell can see playwright')"
          python -c "from pathlib import Path; from our_harness.config import load_config; from our_harness.qa import QaRunner; r = QaRunner(load_config(Path('.'))); print('the harness can see it:', r.browser_available())"
      - name: Start the panel and run the suite
        # One of these checks opens the panel in a browser, so the panel has to
        # be up, and it has to be up in the same step that uses it.
        env:
          PYTHONPATH: src
        run: |
          $panel = Start-Process -FilePath python -PassThru `
            -ArgumentList "-m","our_harness","ui","--port","8765","--no-open-browser" `
            -RedirectStandardOutput panel-out.log -RedirectStandardError panel-err.log
          try {
            $ready = $false
            foreach ($try in 1..60) {
              try {
                Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              Get-Content panel-out.log, panel-err.log -ErrorAction SilentlyContinue
              throw "The control panel did not start, so this suite would prove nothing."
            }
            python -m our_harness qa run --workers 4 `
              --format json --output .harness/qa/ci-report.json
          } finally {
            if ($panel -and -not $panel.HasExited) { Stop-Process -Id $panel.Id -Force }
          }
      - name: Make sure they really ran
        run: |
          $report = Get-Content .harness/qa/ci-report.json -Raw | ConvertFrom-Json
          Write-Host "$($report.counts.passed) passed, $($report.counts.skipped) skipped."
          if ($report.counts.skipped -gt 0) {
            throw "$($report.counts.skipped) check(s) could not be tried here, so this build proves less than it looks like it does."
          }
          if (-not $report.passed) { throw "Some checks failed." }
      - name: Look for anything that should not ship
        env:
          PYTHONPATH: src
        run: python -m our_harness audit
      - name: Keep what the failures looked like
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-checks
          include-hidden-files: true
          path: |
            .harness/qa/runs
            .harness/qa/ci-report.json
            panel-out.log
            panel-err.log
          retention-days: 7

  desktop:
    name: Desktop app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install what the desktop app needs
        working-directory: desktop
        run: npm ci
      - name: Run its tests
        working-directory: desktop
        run: npm test
      - name: Check what would be shipped
        # Not the smoke check. That one opens a real window and waits for it to
        # load, and a build server has no screen to open one on: it waited the
        # full ninety seconds every time and told us nothing about the code.
        # This reads the built app instead, which is the part that keeps
        # breaking anyway - a file left out of the installer kills the app on
        # somebody else's machine, silently.
        working-directory: desktop
        run: node packaging.test.js
      - name: Build the exact unpacked desktop acceptance target
        working-directory: desktop
        env:
          NEXUS_UNSIGNED_DEV: "1"
        run: npm run build -- --win dir
      - name: Exercise real multi-vendor dispatch and recovery in packaged Electron
        working-directory: desktop
        run: npm run e2e:multi-vendor
      - name: Exercise Work together recovery in an ordinary source browser
        working-directory: desktop
        run: npm run smoke:browser-long-horizon

  package:
    name: What we would hand out
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the single file and the wheel
        run: |
          python scripts/build_zipapp.py
          python -m pip wheel . --no-deps -w dist
      - name: Check they hold the same code as the source
        run: python scripts/verify_dist.py
      - name: Keep them
        uses: actions/upload-artifact@v4
        with:
          name: harness-build
          # Both really are written here. Naming a path nothing writes to would
          # keep the job green while handing out less than it says.
          if-no-files-found: error
          path: |
            dist/harness.pyz
            dist/*.whl
          retention-days: 14
