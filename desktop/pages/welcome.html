<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Nexus Harness</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main>
    <h1>Nexus Harness</h1>
    <p class="lead">A helper that works on your code with you. Pick the folder you want to work on and it takes it from there.</p>
    <p>Everything runs on this machine. Nothing is uploaded unless you point it at a hosted model yourself.</p>
    <div class="row">
      <button id="choose" class="primary" type="button">Choose a folder</button>
      <button id="help" type="button">What is this?</button>
    </div>
    <p class="lead" id="status" role="status"></p>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
